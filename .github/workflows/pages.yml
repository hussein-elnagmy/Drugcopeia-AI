name: pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pages.yml'
      - 'Source/www/**'
      - 'Source/scripts/check-shell-urls.mjs'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web app
        run: touch Source/www/.nojekyll
      - name: Every service worker shell file must be in the artifact
        run: node Source/scripts/check-shell-urls.mjs Source/www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Source/www
      - name: Wait for the artifact to be listed
        run: sleep 45
      - id: d
        uses: actions/deploy-pages@v4
      - name: Every service worker shell URL must return 200 on Pages
        run: node Source/scripts/check-shell-urls.mjs "${{ steps.d.outputs.page_url }}"
