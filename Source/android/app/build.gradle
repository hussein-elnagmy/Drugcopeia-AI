apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.dawaya.medicineguide"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dawaya.medicineguide"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 48
        versionName "1.7.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    packagingOptions {
        // The bundled llama.cpp server is executed from the native library
        // directory, so the libraries must be extracted rather than mapped
        // straight out of the APK.
        jniLibs {
            useLegacyPackaging true
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // System Custom Tabs UI for the browser view every link opens (see DawayaShellPlugin).
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Privacy gate: fails the build on a banned SDK, an undeclared host, a new
// manifest permission, a log line that can carry user input, or drift between
// privacy.config.json and any native mirror. Runs before anything is compiled.
tasks.register('privacyCheck', Exec) {
    group = 'verification'
    description = 'Fails the build on a privacy-policy violation.'
    workingDir rootProject.projectDir.parentFile
    commandLine '/usr/bin/python3', 'scripts/privacy-check.py'
}
tasks.named('preBuild').configure { dependsOn tasks.named('privacyCheck') }

// No Firebase / google-services plugin is ever applied here, not even conditionally:
// a plugin that attaches as soon as a google-services.json file happens to appear in
// this directory would give the build a crash-analytics and remote-config channel that
// privacy.config.json does not allow. Dawaya has no such file and must never gain one.
